# Attaches crustates-brand-kit-<tag>.zip to a GitHub release for every v* tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zip the kit
        run: zip -r "crustates-brand-kit-$GITHUB_REF_NAME.zip" svg png README.md TRADEMARK.md LICENSE

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "crustates-brand-kit-$GITHUB_REF_NAME.zip" --verify-tag --generate-notes
